name: CI

# Build + testes da função serverless de notificações.
# Espelha o CI dos demais repositórios do grupo: concurrency, least privilege e versões pinadas.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # net8.0 e não net10.0: o suporte a .NET 10 no host de Azure Functions ainda é preview.
          # Decisão documentada no README.
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Testes
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Gate de segurança. Dois detalhes que já fizeram este gate ser um no-op noutro momento:
      #  1. o relatório do `dotnet list package` imprime a severidade CAPITALIZADA ("High",
      #     "Critical"). Um grep case-sensitive por "high" só pegava, por acidente, a linha de
      #     warning NU1903 — que nem sempre existe (ver 2). Daí o -i e os \b.
      #  2. o NuGetAuditMode default do SDK 8 é `direct`, então vulnerabilidade TRANSITIVA não gera
      #     NU1903 nenhum. O csproj força `all` para o audit enxergar a árvore inteira.
      - name: Vulnerabilidades em dependências
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE '\b(high|critical)\b' vuln.txt; then
            echo "::error::vulnerabilidade high/critical em dependência"
            exit 1
          fi
          echo "nenhuma vulnerabilidade high/critical"

  imagem:
    name: Imagem Docker e smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t notifications-function:ci .

      - name: Sobe RabbitMQ e Redis
        run: |
          docker network create smoke
          docker run -d --name rabbitmq --network smoke rabbitmq:3.13.7-management
          docker run -d --name redis --network smoke redis:7.4.1-alpine
          # Espera pelo log, não por `docker exec rabbitmq-diagnostics`: o exec roda como root e, no
          # prelaunch, cria o .erlang.cookie com dono errado e derruba o broker (eacces).
          for _ in $(seq 1 45); do
            docker logs rabbitmq 2>&1 | grep -q "Server startup complete" && break
            sleep 2
          done
          for q in notifications-user-created notifications-payment-processed; do
            docker exec rabbitmq rabbitmqadmin declare queue name=$q durable=true
          done

      # STUB do users-api. Desde a #9 a confirmação de compra resolve o e-mail do comprador num
      # endpoint interno do users-api — sem ele o resolvedor lança e nenhum e-mail sai. O stub
      # devolve um contato fixo para QUALQUER caminho, o que basta para o smoke exercitar o fluxo
      # inteiro; de brinde, o gate passa a cobrir a resolução de contato, e não só a ICU.
      - name: Sobe o stub do users-api
        run: |
          cat > /tmp/stub-users-api.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  corpo = b'{"email":"comprador-ci@fcg.com"}'
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(corpo)))
                  self.end_headers()
                  self.wfile.write(corpo)
              def log_message(self, *_):
                  pass
          HTTPServer(("", 80), Handler).serve_forever()
          PY
          docker run -d --name users-api-stub --network smoke \
            -v /tmp/stub-users-api.py:/stub.py:ro \
            python:3.12-alpine python /stub.py

      - name: Smoke test — o host indexa as três funções
        run: |
          docker run -d --name fn --network smoke \
            -e AzureWebJobsStorage="" \
            -e RabbitMqConnection="amqp://guest:guest@rabbitmq:5672/" \
            -e Redis__ConnectionString="redis:6379" \
            -e UsersApi__BaseUrl="http://users-api-stub" \
            -e ServiceAuth__SecretKey="CI_Service_HmacSha256_Key_With_At_Least_32_Chars!" \
            notifications-function:ci
          for _ in $(seq 1 45); do
            docker logs fn 2>&1 | grep -q "Job host started" && break
            sleep 2
          done
          docker logs fn > fn.log 2>&1
          # Checagem negativa obrigatória: sem broker, o nome da função aparece na mensagem de erro e
          # um grep só pelo nome passaria mesmo com a função desabilitada.
          if grep -q "failed indexing" fn.log; then
            cat fn.log
            echo "::error::função desabilitada na indexação"
            exit 1
          fi
          for f in UserCreatedFunction PaymentProcessedFunction NotificationHistoryFunction; do
            grep -q "Host.Functions.$f" fn.log || { cat fn.log; echo "::error::$f não foi indexada"; exit 1; }
          done

      - name: Smoke test — confirmação de compra com preço em pt-BR (ICU)
        run: |
          docker exec rabbitmq rabbitmqadmin publish exchange=amq.default \
            routing_key=notifications-payment-processed \
            properties='{"content_type":"application/vnd.masstransit+json"}' \
            payload='{"messageId":"ci-1","conversationId":"ci","messageType":["urn:message:Fcg.Contracts.Events:PaymentProcessedEvent"],"message":{"orderId":"3f2504e0-4f89-11d3-9a0c-0305e82c3301","userId":"u-ci","gameId":"game-42","price":"1234.56","status":"Approved"}}'
          for _ in $(seq 1 30); do
            # Duas exigências. O preço prova a ICU na imagem. A AUSÊNCIA de "To":"u-ci" prova a #9:
            # antes, a confirmação era endereçada ao próprio UserId. O endereço resolvido não pode
            # ser conferido direto — o LogSanitizer mascara e-mail no log (co***@fcg.com).
            if docker logs fn 2>&1 | grep -q 'R\$ 1.234,56' \
               && ! docker logs fn 2>&1 | grep -q '"To":"u-ci"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs fn
          echo "::error::a confirmação não saiu com o preço em pt-BR e o destinatário resolvido"
          exit 1

  iac:
    name: Manifestos Kubernetes e Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar manifestos (kubeconform)
        run: |
          docker run --rm -v "$PWD/deploy/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /k8s

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validar Terraform
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
