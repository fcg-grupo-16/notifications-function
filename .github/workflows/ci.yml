name: CI

# Build + testes da função serverless de notificações.
# Espelha o CI dos demais repositórios do grupo: concurrency, least privilege e versões pinadas.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # net8.0 e não net10.0: o suporte a .NET 10 no host de Azure Functions ainda é preview.
          # Decisão documentada no README.
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Testes
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Mesmo gate de segurança dos outros repos do grupo.
      - name: Vulnerabilidades em dependências
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "critical|high" vuln.txt; then
            echo "::error::vulnerabilidade high/critical em dependência"
            exit 1
          fi
          echo "nenhuma vulnerabilidade high/critical"
